name: UI Automation

on:
  push:
    branches:
      - main

jobs:

  smoke-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Smoke Tests
        run: |
          pytest -m smoke \
          --html=smoke_report.html \
          --self-contained-html

      - name: Upload smoke test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            smoke_report.html
            test-artifacts/
          if-no-files-found: ignore

  regression-tests:

    runs-on: ubuntu-latest

    needs: smoke-tests

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Regression Tests
        run: |
          pytest -m regression \
          --html=regression_report.html \
          --self-contained-html

      - name: Upload regression test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-reports
          path: |
            regression_report.html
            test-artifacts/
          if-no-files-found: ignore

